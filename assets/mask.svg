<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-label="Spider-Man mask">
  <defs>
    <radialGradient id="mrBase" cx="38%" cy="24%" r="88%">
      <stop offset="0%" stop-color="#e02930"/>
      <stop offset="42%" stop-color="#c40d13"/>
      <stop offset="78%" stop-color="#8f060b"/>
      <stop offset="100%" stop-color="#5e0206"/>
    </radialGradient>
    <radialGradient id="mrBrow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4a0104" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4a0104" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mrSide" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3c0104" stop-opacity="0"/>
      <stop offset="70%" stop-color="#3c0104" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3c0104" stop-opacity="0.62"/>
    </radialGradient>
    <radialGradient id="mrBridge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2c0103" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2c0103" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mrSheen" x1="0" y1="0" x2="0.4" y2="1">
