    <path d="M500 -80 C 830 -80 1010 110 1010 330 L-10 330 C -10 110 170 -80 500 -80 Z" fill="url(#mrBrow)"/>
    <path d="M500 -80 C 830 -80 1010 110 1010 330 C 1010 570 790 800 500 830 C 210 800 -10 570 -10 330 C -10 110 170 -80 500 -80 Z" fill="url(#mrSide)"/>
    <ellipse cx="500" cy="430" rx="80" ry="140" fill="url(#mrBridge)"/>
    <path d="M120 640 C 240 760 400 812 500 812 C 600 812 760 760 880 640 C 790 780 640 830 500 830 C 360 830 210 780 120 640 Z" fill="#2c0103" opacity="0.4"/>
    <path d="M500 -80 C 690 -80 830 10 890 160 C 760 55 620 8 500 8 C 380 8 240 55 110 160 C 170 10 310 -80 500 -80 Z" fill="url(#mrSheen)"/>

