    </clipPath>
    <clipPath id="mrEyeL"><path d="M462 440 C 400 452 302 452 250 430 C 200 408 165 368 170 328 C 175 283 215 243 272 236 C 348 227 426 292 452 362 C 460 388 466 420 462 440 Z"/></clipPath>
    <clipPath id="mrEyeR"><path d="M538 440 C 600 452 698 452 750 430 C 800 408 835 368 830 328 C 825 283 785 243 728 236 C 652 227 574 292 548 362 C 540 388 534 420 538 440 Z"/></clipPath>
  </defs>

  <rect width="1000" height="800" fill="url(#mrBase)"/>
  <path d="M500 -80 C 830 -80 1010 110 1010 330 C 1010 570 790 800 500 830 C 210 800 -10 570 -10 330 C -10 110 170 -80 500 -80 Z" fill="url(#mrBase)"/>

  <g clip-path="url(#mrHead)">
