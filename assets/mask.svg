      <ellipse cx="500" cy="352" rx="178" ry="152" transform="rotate(6 500 352)"/>
      <ellipse cx="500" cy="352" rx="286" ry="240" transform="rotate(6 500 352)"/>
      <ellipse cx="500" cy="352" rx="412" ry="336" transform="rotate(6 500 352)"/>
      <ellipse cx="500" cy="352" rx="556" ry="440" transform="rotate(6 500 352)"/>
      <ellipse cx="500" cy="352" rx="720" ry="554" transform="rotate(6 500 352)"/>
      <ellipse cx="500" cy="352" rx="906" ry="680" transform="rotate(6 500 352)"/>
