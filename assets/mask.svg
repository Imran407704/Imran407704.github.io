      <ellipse cx="420" cy="450" rx="110" ry="46" fill="#aeb8ca" opacity="0.55" transform="rotate(-10 420 450)"/>
    </g>
    <path d="M462 440 C 400 452 302 452 250 430 C 200 408 165 368 170 328 C 175 283 215 243 272 236 C 348 227 426 292 452 362 C 460 388 466 420 462 440 Z" fill="none" stroke="#120406" stroke-width="20" stroke-miterlimit="12"/>

    <!-- right eye -->
    <path d="M538 440 C 600 452 698 452 750 430 C 800 408 835 368 830 328 C 825 283 785 243 728 236 C 652 227 574 292 548 362 C 540 388 534 420 538 440 Z" fill="url(#mrEye)"/>
    <g clip-path="url(#mrEyeR)">
      <ellipse cx="710" cy="300" rx="140" ry="70" fill="#ffffff" opacity="0.9" transform="rotate(12 710 300)"/>
      <ellipse cx="580" cy="450" rx="110" ry="46" fill="#aeb8ca" opacity="0.55" transform="rotate(10 580 450)"/>
    </g>
    <path d="M538 440 C 600 452 698 452 750 430 C 800 408 835 368 830 328 C 825 283 785 243 728 236 C 652 227 574 292 548 362 C 540 388 534 420 538 440 Z" fill="none" stroke="#120406" stroke-width="20" stroke-miterlimit="12"/>
