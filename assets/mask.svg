    <path d="M462 440 C 400 452 302 452 250 430 C 200 408 165 368 170 328 C 175 283 215 243 272 236 C 348 227 426 292 452 362 C 460 388 466 420 462 440 Z" fill="url(#mrEye)"/>
    <g clip-path="url(#mrEyeL)">
