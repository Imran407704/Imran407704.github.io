      <path d="M500 352 L40 480"/><path d="M500 352 L170 600"/><path d="M500 352 L330 700"/><path d="M500 352 L500 840"/>
      <path d="M500 352 L670 700"/><path d="M500 352 L830 600"/><path d="M500 352 L960 480"/><path d="M500 352 L1028 330"/>
      <path d="M500 352 L1058 190"/><path d="M500 352 L1070 30"/><path d="M500 352 L1040 -130"/>
      <path d="M500 352 L340 90"/><path d="M500 352 L660 90"/><path d="M500 352 L415 30"/><path d="M500 352 L585 30"/>
      <path d="M500 352 L500 -100"/><path d="M500 352 L140 -60"/><path d="M500 352 L860 -60"/>
