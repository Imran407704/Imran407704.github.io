<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="sred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e02a30"/>
      <stop offset="0.55" stop-color="#c90207"/>
      <stop offset="1" stop-color="#7e0104"/>
    </linearGradient>
    <linearGradient id="sblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f9e"/>
      <stop offset="1" stop-color="#001845"/>
    </linearGradient>
    <radialGradient id="seye" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tiny" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="web" width="86" height="86" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0 43 H86 M43 0 V86 M0 0 L86 86 M86 0 L0 86" stroke="#1d0002" stroke-width="2" opacity="0.5" fill="none"/>
      <circle cx="43" cy="43" r="21" fill="none" stroke="#1d0002" stroke-width="2" opacity="0.55"/>
      <circle cx="43" cy="43" r="42" fill="none" stroke="#1d0002" stroke-width="2" opacity="0.4"/>
    </pattern>
    <clipPath id="headClip">
      <path d="M500 128 C 636 128 720 214 722 330 C 724 420 700 500 654 566 C 616 620 560 660 500 660 C 440 660 384 620 346 566 C 300 500 276 420 278 330 C 280 214 364 128 500 128 Z"/>
    </clipPath>
  </defs>

  <!-- backdrop glow -->
  <ellipse cx="500" cy="1150" rx="330" ry="150" fill="#C90207" opacity="0.16" filter="url(#soft)"/>

  <!-- shoulders / blue torso -->
  <path d="M210 1250 C 216 1060 320 940 500 928 C 680 940 784 1060 790 1250 Z" fill="url(#sblue)"/>
  <path d="M210 1250 C 216 1060 320 940 500 928 C 680 940 784 1060 790 1250 Z" fill="url(#web)" opacity="0.35"/>
  <!-- red chest panel -->
  <path d="M352 1250 C 356 1090 420 1000 500 992 C 580 1000 644 1090 648 1250 Z" fill="url(#sred)"/>
  <path d="M352 1250 C 356 1090 420 1000 500 992 C 580 1000 644 1090 648 1250 Z" fill="url(#web)" opacity="0.8"/>
  <!-- black spider emblem on chest -->
  <g transform="translate(500 1120) scale(1.15)" fill="#0b0b0d">
    <ellipse cx="0" cy="10" rx="13" ry="20"/>
    <circle cx="0" cy="-14" r="9"/>
    <path d="M-12 2 C -34 -8 -50 -18 -64 -34 M-13 10 C -38 10 -56 14 -72 24 M-13 20 C -36 26 -52 36 -64 52 M-11 28 C -28 40 -38 52 -44 68" fill="none" stroke="#0b0b0d" stroke-width="7" stroke-linecap="round"/>
    <path d="M12 2 C 34 -8 50 -18 64 -34 M13 10 C 38 10 56 14 72 24 M13 20 C 36 26 52 36 64 52 M11 28 C 28 40 38 52 44 68" fill="none" stroke="#0b0b0d" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- shoulder highlights -->
  <path d="M240 1250 C 246 1090 320 980 420 952" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="16" stroke-linecap="round" filter="url(#tiny)"/>
  <path d="M760 1250 C 754 1090 680 980 580 952" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="16" stroke-linecap="round" filter="url(#tiny)"/>

  <!-- neck -->
  <path d="M438 620 L 562 620 L 574 730 L 426 730 Z" fill="#5a0d10"/>
  <path d="M442 660 L 558 660" stroke="#2b0507" stroke-width="4" opacity="0.6"/>

  <!-- mask shell -->
  <path d="M500 128 C 636 128 720 214 722 330 C 724 420 700 500 654 566 C 616 620 560 660 500 660 C 440 660 384 620 346 566 C 300 500 276 420 278 330 C 280 214 364 128 500 128 Z" fill="url(#sred)"/>
  <g clip-path="url(#headClip)">
    <rect x="278" y="128" width="446" height="540" fill="url(#web)" opacity="0.85"/>
    <!-- crown highlight -->
    <path d="M500 128 C 636 128 720 214 722 330 C 660 240 590 176 500 176 C 410 176 340 240 278 330 C 280 214 364 128 500 128 Z" fill="#ffffff" opacity="0.16"/>
    <!-- jaw shading -->
    <path d="M346 566 C 384 620 440 660 500 660 C 560 660 616 620 654 566 C 600 616 552 636 500 636 C 448 636 400 616 346 566 Z" fill="#000000" opacity="0.28"/>
  </g>

  <!-- eyes -->
  <path d="M330 300 C 366 258 428 246 470 268 C 492 280 498 306 488 330 C 476 360 444 380 408 378 C 372 376 340 348 330 300 Z" fill="url(#seye)" stroke="#0b0b0d" stroke-width="10" stroke-linejoin="round"/>
  <path d="M670 300 C 634 258 572 246 530 268 C 508 280 502 306 512 330 C 524 360 556 380 592 378 C 628 376 660 348 670 300 Z" fill="url(#seye)" stroke="#0b0b0d" stroke-width="10" stroke-linejoin="round"/>
  <path d="M352 306 C 376 282 412 272 444 282" fill="none" stroke="#0b0b0d" stroke-width="8" opacity="0.55" stroke-linecap="round"/>
  <path d="M648 306 C 624 282 588 272 556 282" fill="none" stroke="#0b0b0d" stroke-width="8" opacity="0.55" stroke-linecap="round"/>

  <!-- jaw web lines -->
  <path d="M420 540 C 460 570 540 570 580 540" fill="none" stroke="#1d0002" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
  <path d="M438 588 C 464 606 536 606 562 588" fill="none" stroke="#1d0002" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

  <!-- mask specular -->
  <g transform="translate(500 400) scale(0.9) translate(-500 -400)">
    <ellipse cx="392" cy="238" rx="56" ry="20" fill="#ffffff" opacity="0.28" transform="rotate(-26 392 238)" filter="url(#tiny)"/>
    <ellipse cx="622" cy="216" rx="38" ry="13" fill="#ffffff" opacity="0.16" transform="rotate(20 622 216)" filter="url(#tiny)"/>
  </g>
  <ellipse cx="300" cy="1060" rx="24" ry="54" fill="#ffffff" opacity="0.1" filter="url(#tiny)"/>
</svg>
