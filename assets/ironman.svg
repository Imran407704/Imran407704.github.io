<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Red and gold powered armour suit, studio portrait">
  <defs>
    <radialGradient id="bgLight" cx="0.5" cy="0.26" r="0.72">
      <stop offset="0" stop-color="#f6f6f4"/>
      <stop offset="0.52" stop-color="#e8e8e5"/>
      <stop offset="1" stop-color="#d2d2ce"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b8b85" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b8b85" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="red" x1="0.12" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ef4a4d"/>
      <stop offset="0.26" stop-color="#c3151f"/>
      <stop offset="0.58" stop-color="#8c0b14"/>
      <stop offset="0.85" stop-color="#5c060c"/>
      <stop offset="1" stop-color="#3d040a"/>
    </linearGradient>
    <linearGradient id="redDark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a51219"/>
      <stop offset="0.55" stop-color="#66070d"/>
      <stop offset="1" stop-color="#360309"/>
    </linearGradient>
    <linearGradient id="redLight" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ff6a63"/>
      <stop offset="0.5" stop-color="#d81e26"/>
      <stop offset="1" stop-color="#93101a"/>
    </linearGradient>

    <linearGradient id="gold" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#ffeeae"/>
      <stop offset="0.18" stop-color="#f8cf63"/>
      <stop offset="0.46" stop-color="#d19b2c"/>
      <stop offset="0.68" stop-color="#f5d98a"/>
      <stop offset="0.86" stop-color="#b47e19"/>
      <stop offset="1" stop-color="#8a5c0f"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f7dd93"/>
      <stop offset="0.5" stop-color="#cf9a2d"/>
      <stop offset="1" stop-color="#8f6113"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43434b"/>
      <stop offset="0.45" stop-color="#25252c"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="0.45" y2="0.2">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="reactor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.26" stop-color="#e6fcff"/>
      <stop offset="0.52" stop-color="#9fe9ff"/>
      <stop offset="0.72" stop-color="#57c8ea"/>
      <stop offset="1" stop-color="#1a86ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ddfaff"/>
      <stop offset="1" stop-color="#8fe8ff" stop-opacity="0.15"/>
    </radialGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softBig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="helmetClip">
      <path d="M500 146 C 604 146 676 198 690 274 C 700 336 694 398 672 452 C 652 512 616 572 566 618 C 538 644 518 660 500 666 C 482 660 462 644 434 618 C 384 572 348 512 328 452 C 306 398 300 336 310 274 C 324 198 396 146 500 146 Z"/>
    </clipPath>
  </defs>

  <rect width="1000" height="1250" fill="url(#bgLight)"/>
  <ellipse cx="500" cy="1200" rx="340" ry="44" fill="url(#floor)"/>
  <ellipse cx="500" cy="470" rx="330" ry="340" fill="#ffffff" opacity="0.3" filter="url(#softBig)"/>

  <!-- torso -->
  <path d="M500 700 C 706 700 848 756 906 846 L 966 1250 L 34 1250 L 94 846 C 152 756 294 700 500 700 Z" fill="url(#redDark)"/>
  <path d="M500 724 C 682 724 812 772 868 852 L 916 1250 L 84 1250 L 132 852 C 188 772 318 724 500 724 Z" fill="url(#red)"/>

  <!-- trapezius plates -->
  <path d="M410 742 C 452 716 548 716 590 742 L 566 800 L 434 800 Z" fill="url(#redLight)" opacity="0.65"/>
  <path d="M410 742 C 452 716 548 716 590 742" fill="none" stroke="#ff8f86" stroke-width="5" opacity="0.35"/>

  <!-- shoulder pauldrons -->
  <path d="M150 862 C 214 794 322 748 412 742 L 384 936 C 300 918 216 890 164 872 Z" fill="url(#redLight)"/>
  <path d="M850 862 C 786 794 678 748 588 742 L 616 936 C 700 918 784 890 836 872 Z" fill="url(#redDark)"/>
  <path d="M150 862 C 214 794 322 748 412 742 L 404 786 C 322 796 230 832 176 880 Z" fill="#ffffff" opacity="0.08"/>
  <path d="M850 862 C 786 794 678 748 588 742 L 596 786 C 678 796 770 832 824 880 Z" fill="#000000" opacity="0.12"/>
  <path d="M384 936 C 330 926 250 906 176 882" fill="none" stroke="#f7d98a" stroke-width="6" opacity="0.5"/>
  <path d="M616 936 C 670 926 750 906 824 882" fill="none" stroke="#f7d98a" stroke-width="6" opacity="0.35"/>

  <!-- chest plate -->
  <path d="M500 764 L 606 806 L 628 892 L 500 962 L 372 892 L 394 806 Z" fill="#4a0509" opacity="0.55"/>
  <path d="M500 778 L 590 814 L 608 888 L 500 950 L 392 888 L 410 814 Z" fill="url(#gold)"/>
  <path d="M500 778 L 590 814 L 608 888 L 500 950 Z" fill="#ffffff" opacity="0.07"/>
  <path d="M500 800 L 500 946" stroke="#8a5c0f" stroke-width="3" opacity="0.35"/>

  <!-- pectoral plates -->
  <path d="M362 900 C 392 936 432 962 470 976 L 452 1060 C 400 1038 352 1000 320 958 Z" fill="url(#redLight)" opacity="0.9"/>
  <path d="M638 900 C 608 936 568 962 530 976 L 548 1060 C 600 1038 648 1000 680 958 Z" fill="url(#redDark)" opacity="0.95"/>

  <!-- collar -->
  <path d="M 398 800 C 442 768 558 768 602 800" fill="none" stroke="#f7d98a" stroke-width="11" stroke-linecap="round"/>
  <path d="M 412 820 C 450 796 550 796 588 820" fill="none" stroke="#6d4a0c" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- head group: scaled to natural helmet-to-shoulder proportions -->
  <g transform="translate(500 690) scale(0.86) translate(-500 -690)">
  <!-- neck -->
  <path d="M 444 640 L 556 640 L 570 748 L 430 748 Z" fill="url(#steel)"/>
  <path d="M 448 668 L 552 668" stroke="#5f5f6a" stroke-width="3" opacity="0.7"/>
  <path d="M 442 704 L 558 704" stroke="#5f5f6a" stroke-width="3" opacity="0.5"/>
  <path d="M 444 640 L 470 640 L 458 748 L 430 748 Z" fill="#ffffff" opacity="0.06"/>

  <!-- helmet shell -->
  <path d="M500 146 C 604 146 676 198 690 274 C 700 336 694 398 672 452 C 652 512 616 572 566 618 C 538 644 518 660 500 666 C 482 660 462 644 434 618 C 384 572 348 512 328 452 C 306 398 300 336 310 274 C 324 198 396 146 500 146 Z" fill="url(#red)"/>

  <g clip-path="url(#helmetClip)">
    <!-- crown highlight -->
    <path d="M500 146 C 604 146 676 198 690 274 C 640 220 570 190 500 190 C 430 190 360 220 310 274 C 324 198 396 146 500 146 Z" fill="#ff7a72" opacity="0.28"/>
    <!-- left rim light -->
    <path d="M500 146 C 396 146 324 198 310 274 C 300 336 306 398 328 452 C 348 512 384 572 434 618 C 462 644 482 660 500 666 C 430 600 380 500 366 400 C 354 316 396 210 500 176 Z" fill="url(#rimLight)" opacity="0.55"/>
    <!-- right shade -->
    <path d="M500 146 C 604 146 676 198 690 274 C 700 336 694 398 672 452 C 652 512 616 572 566 618 C 538 644 518 660 500 666 C 570 600 620 500 634 400 C 646 316 604 210 500 176 Z" fill="#000000" opacity="0.18"/>
    <!-- temple seams -->
    <path d="M330 330 C 356 300 388 282 420 274" fill="none" stroke="#3d040a" stroke-width="5" opacity="0.45"/>
    <path d="M670 330 C 644 300 612 282 580 274" fill="none" stroke="#3d040a" stroke-width="5" opacity="0.45"/>
  </g>

  <!-- faceplate -->
  <path d="M500 170 C 588 170 650 216 662 282 C 672 338 666 394 646 440 C 627 500 594 562 550 604 C 528 624 512 636 500 640 C 488 636 472 624 450 604 C 406 562 373 500 354 440 C 334 394 328 338 338 282 C 350 216 412 170 500 170 Z" fill="url(#gold)"/>

  <!-- faceplate shape shading -->
  <path d="M500 170 C 588 170 650 216 662 282 C 672 338 666 394 646 440 C 627 500 594 562 550 604 C 536 616 522 628 500 640 C 560 580 596 486 596 386 C 596 300 556 220 500 184 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M500 170 C 412 170 350 216 338 282 C 328 338 334 394 354 440 C 373 500 406 562 450 604 C 464 616 478 628 500 640 C 440 580 404 486 404 386 C 404 300 444 220 500 184 Z" fill="#6b4408" opacity="0.14"/>

  <!-- brow -->
  <path d="M362 356 C 424 322 576 322 638 356" fill="none" stroke="#6d4a0c" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  <path d="M362 356 C 424 322 576 322 638 356" fill="none" stroke="#ffeeb4" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- eye sockets -->
  <path d="M372 366 L 468 384 L 464 414 L 380 400 Z" fill="#0b0b0e"/>
  <path d="M628 366 L 532 384 L 536 414 L 620 400 Z" fill="#0b0b0e"/>
  <!-- eye light -->
  <path d="M378 372 L 462 388 L 459 409 L 384 397 Z" fill="url(#eyeGlow)"/>
  <path d="M622 372 L 538 388 L 541 409 L 616 397 Z" fill="url(#eyeGlow)"/>
  <ellipse cx="424" cy="392" rx="44" ry="15" fill="#c9f6ff" opacity="0.4" filter="url(#soft)"/>
  <ellipse cx="576" cy="392" rx="44" ry="15" fill="#c9f6ff" opacity="0.4" filter="url(#soft)"/>

  <!-- centre seam -->
  <path d="M500 184 L 500 604" stroke="#6d4a0c" stroke-width="4" opacity="0.3"/>
  <path d="M500 184 L 500 300" stroke="#fff3c9" stroke-width="2" opacity="0.55"/>

  <!-- cheek plates -->
  <path d="M372 440 C 392 500 424 556 462 594" fill="none" stroke="#6d4a0c" stroke-width="4" opacity="0.35"/>
  <path d="M628 440 C 608 500 576 556 538 594" fill="none" stroke="#6d4a0c" stroke-width="4" opacity="0.35"/>

  <!-- mouth vents -->
  <rect x="456" y="486" width="88" height="9" rx="4" fill="#3d2604" opacity="0.5"/>
  <rect x="462" y="506" width="76" height="9" rx="4" fill="#3d2604" opacity="0.45"/>
  <rect x="470" y="526" width="60" height="9" rx="4" fill="#3d2604" opacity="0.4"/>
  <rect x="478" y="546" width="44" height="9" rx="4" fill="#3d2604" opacity="0.35"/>

  <!-- jaw -->
  <path d="M404 578 C 444 606 556 606 596 578" fill="none" stroke="#6d4a0c" stroke-width="4" opacity="0.3" stroke-linecap="round"/>

  <!-- ear pods -->
  <path d="M306 352 C 294 386 296 438 314 470 L 340 458 C 326 424 324 386 332 358 Z" fill="url(#redDark)"/>
  <path d="M694 352 C 706 386 704 438 686 470 L 660 458 C 674 424 676 386 668 358 Z" fill="url(#redDark)"/>
  <circle cx="322" cy="414" r="6" fill="#f8cf63" opacity="0.9"/>
  <circle cx="678" cy="414" r="6" fill="#f8cf63" opacity="0.9"/>
  </g>

  <!-- arc reactor -->
  <circle cx="500" cy="880" r="104" fill="#8fe8ff" opacity="0.14" filter="url(#softBig)"/>
  <circle cx="500" cy="880" r="64" fill="#16161b"/>
  <circle cx="500" cy="880" r="64" fill="none" stroke="url(#goldPlate)" stroke-width="6"/>
  <circle cx="500" cy="880" r="50" fill="url(#reactor)"/>
  <circle cx="500" cy="880" r="32" fill="#ecfeff"/>
  <circle cx="500" cy="880" r="15" fill="#ffffff"/>
  <g stroke="#8fe8ff" stroke-width="4" opacity="0.55" stroke-linecap="round">
    <path d="M500 806 v14"/><path d="M500 940 v14"/>
    <path d="M426 880 h14"/><path d="M560 880 h14"/>
  </g>

  <!-- torso seams -->
  <g stroke="#330308" stroke-width="4" opacity="0.4" fill="none">
    <path d="M500 972 L 500 1250"/>
    <path d="M424 1044 C 452 1084 470 1150 472 1250"/>
    <path d="M576 1044 C 548 1084 530 1150 528 1250"/>
    <path d="M286 980 C 306 1052 318 1142 320 1250"/>
    <path d="M714 980 C 694 1052 682 1142 680 1250"/>
  </g>
  <path d="M384 1006 L 458 1032" stroke="#f7d98a" stroke-width="4" opacity="0.45"/>
  <path d="M616 1006 L 542 1032" stroke="#f7d98a" stroke-width="4" opacity="0.3"/>

  <!-- specular -->
  <g transform="translate(500 690) scale(0.86) translate(-500 -690)">
    <ellipse cx="408" cy="292" rx="58" ry="22" fill="#ffffff" opacity="0.25" transform="rotate(-24 408 292)" filter="url(#tiny)"/>
    <ellipse cx="612" cy="240" rx="40" ry="14" fill="#ffffff" opacity="0.16" transform="rotate(18 612 240)" filter="url(#tiny)"/>
  </g>
  <ellipse cx="330" cy="900" rx="26" ry="60" fill="#ffffff" opacity="0.1" filter="url(#tiny)"/>

  <!-- floater shadow -->
  <ellipse cx="500" cy="1236" rx="300" ry="26" fill="#000000" opacity="0.2" filter="url(#soft)"/>
</svg>
